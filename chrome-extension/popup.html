<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        width: 260px;
        padding: 14px 16px;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      p { font-size: 12px; opacity: 0.65; margin: 0 0 12px; line-height: 1.4; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      label { font-size: 13px; font-weight: 600; }
      input[type="checkbox"] { width: 38px; height: 22px; }
    </style>
  </head>
  <body>
    <h1>Slowfeed Blocker</h1>
    <p>Blocks the home feeds of Reddit, Bluesky &amp; YouTube. Posts, watches, and Subscriptions still load.</p>
    <div class="row">
      <label for="enabled">Enable blocking</label>
      <input type="checkbox" id="enabled" checked />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
